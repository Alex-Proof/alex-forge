name: Build sandbox image

on:
  push:
    branches: [main]
    paths:
      - "docker/sandbox-alpine-patch/Dockerfile"
      - ".github/workflows/build-sandbox-image.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker/sandbox-alpine-patch
          push: true
          tags: ghcr.io/alex-proof/forge-sandbox-alpine-patch:3.20
